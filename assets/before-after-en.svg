<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="1199" height="429" rx="18" fill="url(#canvas)" stroke="#2b2b30"/>

  <!-- Top Header -->
  <text x="40" y="42" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Directory Layout: Before vs After</text>
  <text x="1160" y="42" text-anchor="end" fill="#8e8e98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Sessions stay grouped under the default workspace while files stay isolated on disk</text>

  <!-- Left Card: BEFORE -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="530" height="326" rx="14" fill="#1a1a1d" stroke="#2d2d33"/>
    <rect x="18" y="16" width="76" height="24" rx="12" fill="#2c1d1f" stroke="#5c2c31"/>
    <text x="56" y="32" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Before</text>
    <text x="106" y="32.5" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">All project-free chats share one root folder</text>
    <line x1="1" y1="54" x2="529" y2="54" stroke="#29292f"/>

    <g transform="translate(24, 74)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="13">
      <text x="0" y="14" fill="#fafafa" font-weight="600">default-workspace/</text>
      <line x1="8" y1="24" x2="8" y2="186" stroke="#32323a" stroke-width="1.2"/>

      <g transform="translate(22, 34)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#32323a" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">test.py</text>
        <text x="206" y="0" fill="#7c7c86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">← scratch script from chat A</text>
      </g>
      <g transform="translate(22, 62)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#32323a" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">output.png</text>
        <text x="206" y="0" fill="#7c7c86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">← easily overwritten by chat B</text>
      </g>
      <g transform="translate(22, 90)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#32323a" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">temp_data.csv</text>
        <text x="206" y="0" fill="#7c7c86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">← orphan intermediate data</text>
      </g>
      <g transform="translate(22, 118)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#32323a" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">report_v2.md</text>
        <text x="206" y="0" fill="#7c7c86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">← deliverables mixed with drafts</text>
      </g>
      <g transform="translate(22, 146)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#32323a" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">scratch.sh</text>
        <text x="206" y="0" fill="#7c7c86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">← leftover one-off scripts</text>
      </g>
      <g transform="translate(22, 174)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#32323a" stroke-width="1.2"/>
        <text x="4" y="0" fill="#71717a">... dozens of ungrouped files</text>
      </g>
    </g>

    <rect x="18" y="274" width="494" height="34" rx="8" fill="#221c1d" stroke="#452b2e"/>
    <text x="34" y="295" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">Cluttered root, filename collisions, hard to trace or clean up by session</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(580, 214)">
    <circle cx="20" cy="18" r="18" fill="#232329" stroke="#383842"/>
    <path d="M13 18h14m0 0l-5-5m5 5l-5 5" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Card: AFTER -->
  <g transform="translate(630, 68)">
    <rect x="0" y="0" width="530" height="326" rx="14" fill="#1a1a1d" stroke="#34343c"/>
    <rect x="18" y="16" width="76" height="24" rx="12" fill="#182b24" stroke="#285846"/>
    <text x="56" y="32" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">After</text>
    <text x="106" y="32.5" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Date-grouped session folders + work / outputs</text>
    <line x1="1" y1="54" x2="529" y2="54" stroke="#29292f"/>

    <g transform="translate(24, 74)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="13">
      <text x="0" y="14" fill="#fafafa" font-weight="600">default-workspace/</text>
      <line x1="8" y1="24" x2="8" y2="184" stroke="#34343e" stroke-width="1.2"/>

      <g transform="translate(22, 34)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#34343e" stroke-width="1.2"/>
        <text x="4" y="0" fill="#e4e4e7" font-weight="600">2026-11-23/</text>
      </g>
      <line x1="32" y1="44" x2="32" y2="152" stroke="#34343e" stroke-width="1.2"/>

      <g transform="translate(46, 62)">
        <rect x="-4" y="-16" width="440" height="24" rx="6" fill="#24242a" stroke="#383842"/>
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#34343e" stroke-width="1.2"/>
        <circle cx="8" cy="-4" r="3" fill="#34d399"/>
        <text x="20" y="0" fill="#ffffff" font-weight="600">session-8f3c...a1b2/</text>
        <text x="424" y="-0.5" text-anchor="end" fill="#8e8e98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">chat A working dir</text>
      </g>
      <line x1="56" y1="74" x2="56" y2="118" stroke="#3d3d48" stroke-width="1.2"/>

      <g transform="translate(70, 92)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#3d3d48" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">work/</text>
        <text x="98" y="0" fill="#8e8e98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">temp scripts &amp; scratch (toggleable)</text>
      </g>
      <g transform="translate(70, 118)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#3d3d48" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">outputs/</text>
        <text x="98" y="0" fill="#8e8e98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">final deliverables (toggleable)</text>
      </g>

      <g transform="translate(46, 150)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#34343e" stroke-width="1.2"/>
        <text x="4" y="0" fill="#d4d4d8">session-4d19...e70c/</text>
        <text x="218" y="0" fill="#7c7c86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">← chat B stays separate</text>
      </g>

      <g transform="translate(22, 182)">
        <line x1="-14" y1="-4" x2="-4" y2="-4" stroke="#34343e" stroke-width="1.2"/>
        <text x="4" y="0" fill="#9a9aa4">2026-11-24/</text>
        <text x="148" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">← next day's sessions grouped neatly</text>
      </g>
    </g>

    <rect x="18" y="274" width="494" height="34" rx="8" fill="#17241f" stroke="#254c3d"/>
    <text x="34" y="295" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">One folder per chat · Subagents inherit cleanly · Other projects untouched</text>
  </g>
</svg>
