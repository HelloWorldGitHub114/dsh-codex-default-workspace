<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="55%" stop-color="#17171a"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 150) rotate(140) scale(460 280)">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="650" y1="44" x2="1152" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e21"/>
      <stop offset="100%" stop-color="#17171a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="url(#bg)" stroke="#2b2b30"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="url(#glow)"/>

  <!-- Left Column: Brand & Headline -->
  <g transform="translate(56, 54)">
    <!-- Plugin Pill -->
    <rect x="0" y="0" width="194" height="30" rx="15" fill="#1f1f23" stroke="#323238"/>
    <circle cx="16" cy="15" r="4" fill="#34d399"/>
    <text x="30" y="19.5" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.2">DeepSeek Harness Plugin</text>

    <!-- Icon + Title -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="54" height="54" rx="14" fill="#222226" stroke="#383840"/>
      <!-- Minimalist Home Icon matching client.js -->
      <g transform="translate(11, 11)" stroke="#f4f4f5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M5 14.4L16 5.6L27 14.4"/>
        <path d="M8 12.4v13.2c0 .8.6 1.4 1.4 1.4h13.2c.8 0 1.4-.6 1.4-1.4V12.4"/>
        <path d="M13.2 27v-7h5.6v7"/>
      </g>
      <text x="72" y="25" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="-0.4">dsh-codex-default-workspace</text>
      <text x="72" y="50" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="400">Codex-style project-free session isolation for DSH</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="148" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">One isolated date-grouped directory per session in your default workspace.</tspan>
      <tspan x="0" dy="26" fill="#8e8e98">默认工作区每次新会话自动分配独立目录 · 原生事件驱动 · 零侵入可清理</tspan>
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0, 204)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="12">
      <rect x="0" y="0" width="178" height="28" rx="8" fill="#1d1d20" stroke="#2f2f35"/>
      <text x="89" y="18" text-anchor="middle" fill="#e4e4e7">YYYY-MM-DD/&lt;session&gt;/</text>

      <rect x="190" y="0" width="140" height="28" rx="8" fill="#1d1d20" stroke="#2f2f35"/>
      <text x="260" y="18" text-anchor="middle" fill="#e4e4e7">work/ · outputs/</text>

      <rect x="342" y="0" width="144" height="28" rx="8" fill="#1d1d20" stroke="#2f2f35"/>
      <text x="414" y="18" text-anchor="middle" fill="#e4e4e7">Native DSH Event</text>
    </g>
  </g>

  <!-- Right Column: Minimalist Folder Preview Card -->
  <g transform="translate(664, 44)">
    <rect x="0" y="0" width="484" height="252" rx="14" fill="url(#cardBg)" stroke="#303036"/>

    <!-- Window Header -->
    <circle cx="20" cy="20" r="4.5" fill="#3a3a42"/>
    <circle cx="36" cy="20" r="4.5" fill="#3a3a42"/>
    <circle cx="52" cy="20" r="4.5" fill="#3a3a42"/>
    <text x="72" y="24" fill="#8e8e98" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="12">default-workspace</text>
    <rect x="366" y="9" width="102" height="22" rx="11" fill="#fafafa"/>
    <text x="417" y="23.5" text-anchor="middle" fill="#141416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Auto-Isolated</text>
    <line x1="1" y1="40" x2="483" y2="40" stroke="#2b2b31"/>

    <!-- Tree Content -->
    <g transform="translate(22, 60)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="13">
      <!-- Root -->
      <g transform="translate(0, 0)">
        <path d="M2 3.5h5l1.6 2h7.4c.8 0 1.5.7 1.5 1.5v6.5c0 .8-.7 1.5-1.5 1.5H2c-.8 0-1.5-.7-1.5-1.5V5c0-.8.7-1.5 1.5-1.5z" stroke="#d4d4d8" stroke-width="1.3" fill="none"/>
        <text x="26" y="13.5" fill="#fafafa" font-weight="600">default-workspace/</text>
      </g>

      <!-- Vertical guide -->
      <line x1="9" y1="22" x2="9" y2="164" stroke="#32323a" stroke-width="1.2"/>

      <!-- Date folder -->
      <g transform="translate(22, 30)">
        <line x1="-13" y1="9" x2="-3" y2="9" stroke="#32323a" stroke-width="1.2"/>
        <path d="M2 3.5h5l1.6 2h7.4c.8 0 1.5.7 1.5 1.5v6.5c0 .8-.7 1.5-1.5 1.5H2c-.8 0-1.5-.7-1.5-1.5V5c0-.8.7-1.5 1.5-1.5z" stroke="#a1a1aa" stroke-width="1.3" fill="none"/>
        <text x="26" y="13.5" fill="#e4e4e7">2026-11-23/</text>
      </g>

      <!-- Date vertical guide -->
      <line x1="31" y1="52" x2="31" y2="164" stroke="#32323a" stroke-width="1.2"/>

      <!-- Active Session Highlight Row -->
      <g transform="translate(42, 58)">
        <rect x="-4" y="-5" width="404" height="28" rx="7" fill="#25252b" stroke="#3b3b44"/>
        <line x1="-11" y1="9" x2="-4" y2="9" stroke="#32323a" stroke-width="1.2"/>
        <circle cx="8" cy="9" r="3.5" fill="#34d399"/>
        <text x="22" y="13.5" fill="#ffffff" font-weight="600">session-8f3c...a1b2/</text>
        <text x="390" y="13" text-anchor="end" fill="#8e8e98" font-size="11">active cwd</text>
      </g>

      <!-- Session vertical guide -->
      <line x1="52" y1="84" x2="52" y2="132" stroke="#3a3a44" stroke-width="1.2"/>

      <!-- work/ -->
      <g transform="translate(66, 92)">
        <line x1="-14" y1="9" x2="-4" y2="9" stroke="#3a3a44" stroke-width="1.2"/>
        <text x="4" y="13" fill="#d4d4d8">work/</text>
        <text x="92" y="13" fill="#7c7c86" font-size="11.5"># scratch &amp; temp files</text>
      </g>

      <!-- outputs/ -->
      <g transform="translate(66, 120)">
        <line x1="-14" y1="9" x2="-4" y2="9" stroke="#3a3a44" stroke-width="1.2"/>
        <text x="4" y="13" fill="#d4d4d8">outputs/</text>
        <text x="92" y="13" fill="#7c7c86" font-size="11.5"># final deliverables</text>
      </g>

      <!-- Second Session -->
      <g transform="translate(42, 152)">
        <line x1="-11" y1="9" x2="-3" y2="9" stroke="#32323a" stroke-width="1.2"/>
        <path d="M2 3.5h5l1.6 2h7.4c.8 0 1.5.7 1.5 1.5v6.5c0 .8-.7 1.5-1.5 1.5H2c-.8 0-1.5-.7-1.5-1.5V5c0-.8.7-1.5 1.5-1.5z" stroke="#71717a" stroke-width="1.3" fill="none"/>
        <text x="26" y="13.5" fill="#9a9aa4">session-4d19...e70c/</text>
      </g>
    </g>
  </g>
</svg>
